<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Usuário</title>
    <script src="ajax.js"></script>
    <script>
        function cadastrarUsuario(evento) {
            evento.preventDefault();

            let formulario = document.getElementById("frmUsuario");

            enviarRequisicao("POST", "cadastroUsuario.php", new FormData(formulario), function (resposta) {
                mostrarMensagem(resposta);
                if (resposta.sucesso) formulario.reset();
            });
        }
    </script>
</head>
<body>
    <h1>Cadastro Usuário</h1>

    <form id="frmUsuario" onsubmit="cadastrarUsuario(event)">
        Nome:
        <input type="text" name="nome" required>
        <br>

        Email:
        <input type="email" name="email" required>
        <br>

        Senha:
        <input type="password" name="senha" required>
        <br>

        <input type="submit" value="Cadastrar Usuário">
    </form>

    <p id="msg"></p>

    <a href="listarUsuarios.html">Listar Usuários</a> |
    <a href="index.html">Menu</a>
</body>
</html>
