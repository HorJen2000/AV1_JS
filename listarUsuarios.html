<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>
    <script src="ajax.js"></script>
    <script>
        function carregarUsuarios() {
            enviarRequisicao("GET", "listarUsuarios.php", null, function (resposta) {

                let corpo = document.getElementById("corpoTabela");
                corpo.innerHTML = "";

                for (let u of resposta.usuarios) {
                    let tr = document.createElement("tr");

                    adicionarCelula(tr, u.nome);
                    adicionarCelula(tr, u.email);
                    adicionarCelula(tr, u.senha);

                    let tdAlterar = adicionarCelula(tr, "");
                    tdAlterar.innerHTML = '<a href="alterarUsuario.html?email=' + encodeURIComponent(u.email) + '">Alterar</a>';

                    let tdExcluir = adicionarCelula(tr, "");
                    let botao = document.createElement("button");
                    botao.textContent = "Excluir";
                    botao.onclick = function () { excluirUsuario(u.email); };
                    tdExcluir.appendChild(botao);

                    corpo.appendChild(tr);
                }
            });
        }

        function excluirUsuario(email) {
            if (!confirm("Excluir o usuário " + email + "?")) return;

            enviarRequisicao("GET", "excluirUsuario.php?email=" + encodeURIComponent(email), null, function (resposta) {
                mostrarMensagem(resposta);
                carregarUsuarios();
            });
        }

        window.onload = carregarUsuarios;
    </script>
</head>
<body>
    <h1>Lista de Usuários</h1>

    <p id="msg"></p>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Senha</th>
                <th>Alterar</th>
                <th>Excluir</th>
            </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>

    <br>
    <a href="cadastroUsuario.html">Cadastrar usuário</a> |
    <a href="index.html">Menu</a>
</body>
</html>
