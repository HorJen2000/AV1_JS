<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Perguntas</title>
    <script src="ajax.js"></script>
    <script>
        function carregarPerguntas() {
            enviarRequisicao("GET", "listarPerguntas.php", null, function (resposta) {

                let corpo = document.getElementById("corpoTabela");
                corpo.innerHTML = "";

                for (let p of resposta.perguntas) {
                    let tr = document.createElement("tr");

                    adicionarCelula(tr, p.id);
                    adicionarCelula(tr, p.pergunta);
                    adicionarCelula(tr, p.resposta1);
                    adicionarCelula(tr, p.resposta2);
                    adicionarCelula(tr, p.resposta3);
                    adicionarCelula(tr, p.correta);

                    let tdVer = adicionarCelula(tr, "");
                    tdVer.innerHTML = '<a href="listarUmaPergunta.html?id=' + encodeURIComponent(p.id) + '">Ver</a>';

                    let tdAlterar = adicionarCelula(tr, "");
                    tdAlterar.innerHTML = '<a href="alterarPergunta.html?id=' + encodeURIComponent(p.id) + '">Alterar</a>';

                    let tdExcluir = adicionarCelula(tr, "");
                    let botao = document.createElement("button");
                    botao.textContent = "Excluir";
                    botao.onclick = function () { excluirPergunta(p.id); };
                    tdExcluir.appendChild(botao);

                    corpo.appendChild(tr);
                }
            });
        }

        function excluirPergunta(id) {
            if (!confirm("Excluir a pergunta " + id + "?")) return;

            enviarRequisicao("GET", "excluirPergunta.php?id=" + encodeURIComponent(id), null, function (resposta) {
                mostrarMensagem(resposta);
                carregarPerguntas();
            });
        }

        window.onload = carregarPerguntas;
    </script>
</head>
<body>
    <h1>Lista de Perguntas</h1>

    <p id="msg"></p>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Pergunta</th>
                <th>Resposta 1</th>
                <th>Resposta 2</th>
                <th>Resposta 3</th>
                <th>Correta</th>
                <th>Ver</th>
                <th>Alterar</th>
                <th>Excluir</th>
            </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>

    <br>
    <a href="criarPergunta.html">Criar nova pergunta</a> |
    <a href="index.html">Menu</a>
</body>
</html>
