<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Pergunta</title>
    <script src="ajax.js"></script>
    <script>
        // Ao abrir a página, busca a pergunta no PHP e preenche o formulário
        function carregarPergunta() {
            let id = pegarParametro("id");

            enviarRequisicao("GET", "listarUmaPergunta.php?id=" + encodeURIComponent(id), null, function (resposta) {
                if (!resposta.sucesso) {
                    mostrarMensagem(resposta);
                    return;
                }
                let p = resposta.pergunta;
                // form.elements["nome"] pega o campo pelo atributo name
                let campos = document.getElementById("frmPergunta").elements;
                campos["id"].value        = p.id;
                campos["pergunta"].value  = p.pergunta;
                campos["resposta1"].value = p.resposta1;
                campos["resposta2"].value = p.resposta2;
                campos["resposta3"].value = p.resposta3;
                campos["correta"].value   = p.correta;
            });
        }

        function alterarPergunta(evento) {
            evento.preventDefault();

            let formulario = document.getElementById("frmPergunta");

            enviarRequisicao("POST", "alterarPergunta.php", new FormData(formulario), function (resposta) {
                mostrarMensagem(resposta);
            });
        }

        window.onload = carregarPergunta;
    </script>
</head>
<body>
    <h1>Alterar Pergunta</h1>

    <form id="frmPergunta" onsubmit="alterarPergunta(event)">

        <input type="hidden" name="id">

        Pergunta:
        <input type="text" name="pergunta" required><br>

        Resposta 1:
        <input type="text" name="resposta1" required><br>

        Resposta 2:
        <input type="text" name="resposta2" required><br>

        Resposta 3:
        <input type="text" name="resposta3" required><br>

        Resposta Correta (1, 2 ou 3):
        <input type="number" name="correta" min="1" max="3" required><br>

        <input type="submit" value="Alterar Pergunta">
    </form>

    <p id="msg"></p>

    <a href="listarPerguntas.html">Voltar para a lista</a>
</body>
</html>
